<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- colorsbymax pre-paint: applies the saved theme before first paint (key: colorsbymax-demo). -->
    <script>
      (function(){try{var s=JSON.parse(localStorage.getItem("colorsbymax-demo")||'null');var t=s&&s.v===1&&s.resolved;if(!t||typeof t!=='object')return;var d=document.documentElement.style;for(var k in t){var v=t[k];if(/^[a-z0-9-]+$/.test(k)&&/^#[0-9a-f]{6}$/i.test(v))d.setProperty('--color-'+k,v)}}catch(e){}})()
    </script>
    <title>colorsbymax™: a live theme switcher for any website</title>
    <meta name="description" content="colorsbymax adds a colour button to your website: try 700+ professionally built palettes on your real pages, live, with every colour in the right role and contrast checked. By mrmaxdesigns." />
    <meta name="theme-color" content="#593bf5" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
