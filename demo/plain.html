<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Northfield Bakery</title>
    <style>
      /* A plain-CSS site: no Tailwind, colours read from colorsbymax's --color-* variables. */
      :root {
        --color-primary: #b4532a;
        --color-primary-dark: #6b2d14;
        --color-on-primary: #ffffff;
        --color-background: #fbf6ef;
        --color-surface: #ffffff;
        --color-secondary: #f3e3d3;
        --color-on-secondary: #6b2d14;
        --color-border: #e6d5c3;
        --color-ink: #2b1a10;
        --color-ink-secondary: #6b5444;
      }
      body {
        margin: 0;
        font-family: Georgia, serif;
        background: var(--color-background);
        color: var(--color-ink);
      }
      header { background: var(--color-primary-dark); color: var(--color-on-primary); padding: 1.5rem 2rem; }
      main { max-width: 48rem; margin: 0 auto; padding: 3rem 2rem; }
      .hero { background: var(--color-secondary); color: var(--color-on-secondary); border-radius: 1rem; padding: 2rem; }
      .card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: 1rem; padding: 1.5rem; margin-top: 1.5rem; }
      .card p { color: var(--color-ink-secondary); }
      .cta { background: var(--color-primary); color: var(--color-on-primary); }

      /* Stress test: careless global rules a real site might have. None of them should change
         how the colorsbymax panel looks. */
      html { font-size: 10px; }
      body { line-height: 2.4; letter-spacing: 0.05em; }
      * { box-sizing: content-box; }
      div { margin: 0.4rem 0; }
      button { font: italic 20px/1 Georgia, serif; padding: 1.6rem 2.4rem; border: 3px solid currentColor; border-radius: 0; text-transform: uppercase; }
      input, textarea { font-size: 22px; background: yellow; }
      h2, h3 { font-family: "Comic Sans MS", cursive; }
      p { margin: 2rem 0; }
      svg { width: 40px; height: 40px; }
      summary { list-style: disc; }
    </style>
  </head>
  <body>
    <header><strong>Northfield Bakery</strong></header>
    <main>
      <section class="hero">
        <h1>Bread worth getting up for</h1>
        <p>Sourdough, rye and pastries, baked every morning since 1998.</p>
        <button class="cta">Order for pickup</button>
      </section>
      <div class="card">
        <h2>Today's loaves</h2>
        <p>Country sourdough, seeded rye, olive and rosemary focaccia.</p>
      </div>
    </main>
    <div id="colorsbymax"></div>
    <script type="module" src="./plain.jsx"></script>
  </body>
</html>
